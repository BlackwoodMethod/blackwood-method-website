name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          VITE_APP_TITLE: "Blackwood Method"
          VITE_APP_ID: "YHKC22aTBZYKYVY4htDXjg"
          VITE_APP_LOGO: "https://files.manuscdn.com/user_upload_by_module/web_dev_logo/310519663154077196/QALxPYTlwJSdogxY.png"
          VITE_ANALYTICS_ENDPOINT: "https://manus-analytics.com"
          VITE_ANALYTICS_WEBSITE_ID: "35d0b256-a2dd-4b04-bb3f-a4bac2076d79"
          VITE_OAUTH_PORTAL_URL: "https://manus.im"
          VITE_FRONTEND_FORGE_API_URL: "https://forge.manus.ai"
          VITE_FRONTEND_FORGE_API_KEY: "7CsoJN5EkZiedFJV3CPMD3"
          # Supabase Secrets - Must be configured in GitHub Repo Settings > Secrets and variables > Actions
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Move Build Output
        run: |
          mkdir -p _site
          cp -r dist/public/* _site/
          # Create CNAME file for custom domain
          echo "blackwoodmethod.com" > _site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
